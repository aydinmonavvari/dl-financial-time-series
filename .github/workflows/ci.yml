name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev extras
        run: pip install -e .[dev]

      - name: Lint (ruff)
        run: ruff check .

      # CI installs only the light base deps (no torch): the torch-dependent test
      # modules skip themselves via pytest.importorskip("torch"), and every other
      # test is offline (synthetic fixtures, no network access).
      - name: Tests (pytest, offline, no network)
        run: pytest tests/ -q
